name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "web/pets/**"
      - ".github/workflows/windows-package.yml"

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test rules
        run: dotnet test windows/Mochi.sln -c Release --nologo

      - name: Publish hook
        run: dotnet publish windows/Mochi.HookCLI/Mochi.HookCLI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/hook

      - name: Publish app
        run: dotnet publish windows/MochiIsland/MochiIsland.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o artifacts/MochiIsland

      - name: Put the hook beside the app
        shell: pwsh
        run: Copy-Item artifacts/hook/MochiHookCLI.exe artifacts/MochiIsland/MochiHookCLI.exe -Force

      - name: Hook runs and exits 0
        shell: pwsh
        run: |
          $output = "{}" | & "$PWD/artifacts/MochiIsland/MochiHookCLI.exe" --source cursor
          if ($LASTEXITCODE -ne 0) { throw "MochiHookCLI exited $LASTEXITCODE" }
          if ($output -notmatch '\{') { throw "MochiHookCLI printed: $output" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/MochiIsland/* -DestinationPath MochiIsland-Windows-1.0.zip -Force

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-windows1
          name: Mochi Island 1.0 for Windows
          make_latest: false
          files: MochiIsland-Windows-1.0.zip
          body: |
            Windows 11 22H2（22621）或更新。解压后直接运行，不需要再装运行库。

            1. 下载 `MochiIsland-Windows-1.0.zip`，解压到一个单独的文件夹。不要只把 exe 拖出来。
            2. 双击 `MochiIsland.exe`。
            3. 如果系统提示无法验证发布者，点「更多信息」，再点「仍要运行」。
            4. 小猫出现后，点齿轮打开设置，在 Agents 里点 Connect。

            `MochiHookCLI.exe` 必须和 `MochiIsland.exe` 留在同一个文件夹。连接只写在这一台电脑上。

            Mac 版仍是 [v1.0-build4](https://github.com/AlbertQiu-design/mochi-V3/releases/tag/v1.0-build4)。
